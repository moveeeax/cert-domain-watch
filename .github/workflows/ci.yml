name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    name: build (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The whole suite runs offline against fixtures and generated
      # certificates; no registry, no network, no credentials.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build release binary
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/cdw ./cmd/cdw

      - name: Smoke test the binary
        run: |
          ./bin/cdw version
          ./bin/cdw coverage
